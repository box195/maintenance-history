<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무이력 조회실</title><style>:root{font-family:system-ui,sans-serif;color:#182b43;background:#f2f5f9}*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100dvh;padding:22px}main{width:min(100%,420px);background:#fff;border:1px solid #dae2ec;border-radius:18px;padding:32px;box-shadow:0 12px 38px #203a5510}h1{font-size:25px;margin:0 0 8px}p{font-size:14px;color:#617389;line-height:1.6}label{font-weight:600;font-size:13px;display:block;margin:22px 0 8px}input,button{width:100%;padding:13px;border-radius:8px;font:inherit}input{border:1px solid #acbbcc}button{border:0;color:white;background:#235da6;font-weight:650;margin-top:12px;cursor:pointer}button:disabled{opacity:.65}#message{min-height:24px;color:#aa3434;font-size:13px;overflow-wrap:anywhere}small{color:#75869a}</style></head><body><main><h1>업무이력 조회실</h1><p>업무 기록을 열려면 발급된 접근 키를 입력하세요.</p><form id="unlock"><label for="key">접근 키</label><input id="key" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">열기</button><p id="message" role="status"></p></form><small>암호화된 업무 기록 · GitHub Pages</small></main><script>
'use strict';const form=document.getElementById('unlock'),field=document.getElementById('key'),button=document.getElementById('submit'),msg=document.getElementById('message');const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg.textContent='데이터를 불러오는 중…';try{if(!crypto.subtle||!window.DecompressionStream)throw Error('최신 Chrome 또는 Edge를 사용해 주세요.');const res=await fetch('history.enc.json',{cache:'no-store'});if(!res.ok)throw Error('데이터 다운로드 실패 (HTTP '+res.status+')');const p=await res.json();if(p.version!==1||p.iterations!==600000||p.compression!=='gzip')throw Error('지원하지 않는 데이터 형식');const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv),tagLength:128},key,b64(p.ciphertext))}catch(e){throw Error('접근 키가 일치하지 않거나 데이터가 손상됐습니다.')}const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.startsWith('<!doctype html>'))throw Error('데이터 형식 오류');field.value='';document.open();document.write(html);document.close()}catch(e){msg.textContent=e.message||'열기 실패';button.disabled=false}});
</script></body></html>
